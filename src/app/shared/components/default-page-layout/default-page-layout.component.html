<div class="min-h-screen flex flex-col">
  <a class="skip-link" href="#main-content">{{ "LABELS.SKIP_TO_CONTENT" | translate }}</a>
  <header class="sticky top-0 z-30 border-b border-base-300 bg-base-100/90 backdrop-blur">
    <div class="page-width flex h-16 items-center justify-between gap-4">
      <app-main-logo></app-main-logo>
      <div class="flex items-center gap-2">
        <a class="btn btn-primary btn-sm hidden sm:inline-flex" routerLink="/create">
          {{ "LABELS.CREATE" | translate }}
        </a>
        <app-theme-toggle></app-theme-toggle>
      </div>
    </div>
  </header>
  <main id="main-content" class="page-width flex-1 py-9 md:py-12">
    <div class="mx-auto max-w-4xl">
      @if (title(); as title) {
        <h1 class="page-heading mb-2 text-3xl font-semibold md:text-4xl">{{ title }}</h1>
      }
      @if (subTitleTemplate(); as template) {
        <ng-container *ngTemplateOutlet="template"></ng-container>
      } @else if (subTitle(); as subTitle) {
        <p class="mb-8 max-w-2xl text-base text-base-content/65">{{ subTitle }}</p>
      }
      <div class="page-body">
        <ng-content></ng-content>
      </div>
    </div>
  </main>
  <footer class="border-t border-base-300 bg-base-100">
    <div class="page-width py-5 text-sm text-base-content/60">
      {{ "LABELS.SECRET_SANTA" | translate }}
    </div>
  </footer>
</div>
