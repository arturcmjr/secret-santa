<div
  class="fixed inset-0 z-[90] grid place-items-center bg-base-100/70 backdrop-blur-[2px] transition-opacity"
  [class.invisible]="!isLoading()"
  [attr.aria-hidden]="!isLoading()"
  [attr.aria-busy]="isLoading()"
>
  <span class="loading loading-spinner loading-lg text-primary" role="status" [attr.aria-label]="'MESSAGES.INFO_LOADING' | translate"></span>
</div>
