<header class="sticky top-0 z-30 border-b border-base-300 bg-base-100/90 backdrop-blur">
  <div class="page-width flex h-16 items-center justify-between gap-4">
    <a
      class="inline-flex items-center focus-visible:rounded-lg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
      routerLink="/"
      aria-label="Secret Santa home"
    >
      <img class="h-10 w-auto" src="assets/img/amiko/amiko.svg" alt="Secret Santa" />
    </a>
    <div class="flex items-center gap-2">
      <a class="btn btn-ghost btn-sm" routerLink="/my-secret-santas">
        {{ "DASHBOARD.TITLE" | translate }}
      </a>
      <a class="btn btn-primary btn-sm hidden sm:inline-flex" routerLink="/create">
        {{ "LABELS.CREATE" | translate }}
      </a>
      <app-theme-toggle></app-theme-toggle>
    </div>
  </div>
</header>
