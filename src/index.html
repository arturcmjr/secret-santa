  <meta name="theme-color" content="#0F766E">

  <meta name="description" content="Organize seu amigo oculto (amigo secreto) online em três passos. Sorteio justo, link privado para cada participante, sem cadastro e sem custo.">
  <script>
    // Applies the saved theme before first paint to avoid a light flash on server rendered pages
    (function () {
      try {
        var theme = localStorage.getItem('secret-santa-theme');
        if (theme !== 'secret-santa-light' && theme !== 'secret-santa-dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'secret-santa-dark' : 'secret-santa-light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Amiko",
      "alternateName": ["Amigo oculto", "Amigo secreto online", "Secret Santa"],

      "description": "Organize seu amigo oculto online em três passos, sem cadastro e sem custo.",
      "applicationCategory": "LifestyleApplication",
      "operatingSystem": "Any",
      "inLanguage": ["pt-BR", "en"],
      "image": "https://amiko.arju.dev/assets/img/og-image.png",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "BRL" }
    }
  </script>
