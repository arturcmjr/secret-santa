# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build:firebase
      - run: npm install --prefix functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ARJU_SECRET_SANTA }}'
      # Hosting serves the static files and forwards dynamic routes to the `ssr` Cloud Function
      - run: npx firebase-tools@latest deploy --only hosting,functions --project arju-secret-santa
